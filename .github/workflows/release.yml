name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release identity
        run: |
          version="$(sed -n 's/^addon_version=//p' gradle.properties)"
          test -n "${version}"
          [[ "${version}" != *-SNAPSHOT ]]
          test "${GITHUB_REF_NAME}" = "v${version}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Check out exact BlueMap backport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jan-guenter/BlueMap
          ref: 9be321df995a1103808621d529eb72773e719d4d
          path: .ci/bluemap
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up Gradle 9.4.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.4.0'

      - name: Acquire exact ephemeral runtime inputs
        run: |
          input_dir="${RUNNER_TEMP}/sophisticated"
          mkdir -p "${input_dir}"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/sophisticatedcore-1.21.1-1.4.80.2194.jar" \
            "https://mediafilez.forgecdn.net/files/8503/41/sophisticatedcore-1.21.1-1.4.80.2194.jar"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/sophisticatedstorage-1.21.1-1.5.83.2017.jar" \
            "https://mediafilez.forgecdn.net/files/8503/122/sophisticatedstorage-1.21.1-1.5.83.2017.jar"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/sophisticatedbackpacks-1.21.1-3.25.73.2027.jar" \
            "https://mediafilez.forgecdn.net/files/8569/661/sophisticatedbackpacks-1.21.1-3.25.73.2027.jar"

      - name: Build and verify release once
        run: |
          input_dir="${RUNNER_TEMP}/sophisticated"
          python3 gallery/generate.py --check
          python3 -m json.tool provenance/upstreams.json >/dev/null
          (cd gallery && sha256sum --check SHA256SUMS)
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            -PsophisticatedCoreJar="${input_dir}/sophisticatedcore-1.21.1-1.4.80.2194.jar" \
            -PsophisticatedStorageJar="${input_dir}/sophisticatedstorage-1.21.1-1.5.83.2017.jar" \
            -PsophisticatedBackpacksJar="${input_dir}/sophisticatedbackpacks-1.21.1-3.25.73.2027.jar" \
            clean check build generatePomFileForAddonPublication \
            generateMetadataFileForAddonPublication verifyPinnedArtifacts

      - name: Prepare release bundle
        run: |
          mkdir release
          cp "build/libs/bluemap-sophisticated-addon-${VERSION}.jar" release/
          cp "build/libs/bluemap-sophisticated-addon-${VERSION}-sources.jar" release/
          cp build/publications/addon/pom-default.xml \
            "release/bluemap-sophisticated-addon-${VERSION}.pom"
          cp build/publications/addon/module.json \
            "release/bluemap-sophisticated-addon-${VERSION}.module.json"
          cd release
          sha256sum -- ./* > SHA256SUMS

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_kind=()
          if [[ "${VERSION}" == *-* ]]; then
            release_kind+=(--prerelease)
          else
            release_kind+=(--latest)
          fi
          gh release create "${GITHUB_REF_NAME}" release/* \
            "${release_kind[@]}" \
            --draft \
            --generate-notes \
            --title "BlueMap Sophisticated Add-on ${VERSION}" \
            --verify-tag

      - name: Attest release JARs
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/*.jar

      - name: Publish Maven package
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            publishAddonPublicationToGitHubPackagesRepository

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${VERSION}" == *-* ]]; then
            gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease
          else
            gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
          fi
