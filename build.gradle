// SPDX-License-Identifier: MIT

plugins {
    id 'java-library'
    id 'checkstyle'
    id 'maven-publish'
    id 'io.github.janguenter.bluemap-addon.java-conventions'
}

group = addon_group
version = addon_version

base {
    archivesName = artifact_id
}

sourceSets {
    main.java.srcDir 'modules/bluemap-addon-adapter-api/src/main/java'
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://repo.bluecolored.de/releases')
        content { includeGroupByRegex('de\\.bluecolored.*') }
    }
}

dependencies {
    compileOnly "de.bluecolored:bluemap-core:${bluemap_version}"
    compileOnly 'org.jetbrains:annotations:23.0.0'

    testImplementation "de.bluecolored:bluemap-core:${bluemap_version}"
    testImplementation 'org.jetbrains:annotations:23.0.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('jar', Jar).configure {
    includeEmptyDirs = false
    manifest {
        attributes(
                'Automatic-Module-Name': 'io.github.janguenter.bluemap.sophisticated',
                'Implementation-Title': addon_name,
                'Implementation-Version': project.version.toString()
        )
    }
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-sophisticated-addon' }
    }
    from('NOTICE.md') {
        into 'META-INF'
        rename { 'NOTICE-bluemap-sophisticated-addon.md' }
    }
    from('THIRD_PARTY.md') {
        into 'META-INF'
        rename { 'THIRD_PARTY-bluemap-sophisticated-addon.md' }
    }
    from('provenance/upstreams.json') {
        into 'META-INF/bluemap-sophisticated'
    }
}

tasks.named('sourcesJar', Jar).configure {
    includeEmptyDirs = false
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE-bluemap-sophisticated-addon' }
    }
    from('NOTICE.md') {
        into 'META-INF'
        rename { 'NOTICE-bluemap-sophisticated-addon.md' }
    }
    from('THIRD_PARTY.md') {
        into 'META-INF'
        rename { 'THIRD_PARTY-bluemap-sophisticated-addon.md' }
    }
    from('provenance/upstreams.json') {
        into 'META-INF/bluemap-sophisticated'
    }
}

def productionJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def publishedSourcesJar = tasks.named('sourcesJar', Jar).flatMap { it.archiveFile }
def sharedAdapterApiPackage =
        'io/github/janguenter/bluemap/addon/adapter/api/bluemap523/'
def sharedAdapterApiClasses = [
        'BlueMapRuntimeCompatibility.class',
        'RegistryGuard.class',
        'ResourceExtensionType.class',
        'SyntheticDispatch.class'
].collect { sharedAdapterApiPackage + it }
def sharedAdapterApiSources = [
        'BlueMapRuntimeCompatibility.java',
        'RegistryGuard.java',
        'ResourceExtensionType.java',
        'SyntheticDispatch.java'
].collect { sharedAdapterApiPackage + it }
def legacyLocalAdapterPackage =
        'io/github/janguenter/bluemap/sophisticated/adapter/bluemap522/'
def displacedAdapterHelpers = [
        'io/github/janguenter/bluemap/sophisticated/adapter/bluemap523/AdapterCompatibility',
        'io/github/janguenter/bluemap/sophisticated/adapter/bluemap523/'
                + 'SophisticatedResourceExtensionType'
]

tasks.register('verifyProductionJar') {
    dependsOn tasks.named('jar')
    inputs.file(productionJar)

    doLast {
        def jarFile = inputs.files.singleFile
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def entries = zip.entries().findAll { !it.directory }.collect { it.name }
            def required = [
                    'bluemap.addon.json',
                    'assets/bluemap_sophisticated/blockstates/sophisticated_shape.json',
                    'bluemap-sophisticated/profiles/exact-artifacts.json',
                    'bluemap-sophisticated/profiles/sophisticatedcore/1.4.80/profile.json',
                    'bluemap-sophisticated/profiles/sophisticatedstorage/1.5.83/profile.json',
                    'bluemap-sophisticated/profiles/sophisticatedstorage/1.5.83/required-resources.tsv',
                    'bluemap-sophisticated/profiles/sophisticatedbackpacks/3.25.73/profile.json',
                    'bluemap-sophisticated/profiles/sophisticatedbackpacks/3.25.73/required-resources.tsv',
                    'META-INF/LICENSE-bluemap-sophisticated-addon',
                    'META-INF/NOTICE-bluemap-sophisticated-addon.md',
                    'META-INF/THIRD_PARTY-bluemap-sophisticated-addon.md',
                    'META-INF/bluemap-sophisticated/upstreams.json'
            ]
            required.addAll(sharedAdapterApiClasses)
            def missing = required.findAll { !entries.contains(it) }
            def nonUniqueShared = sharedAdapterApiClasses.findAll { shared ->
                entries.count { it == shared } != 1
            }
            def foreignClasses = entries.findAll { entry ->
                entry.endsWith('.class')
                        && !entry.startsWith(
                            'io/github/janguenter/bluemap/sophisticated/'
                        )
                        && !sharedAdapterApiClasses.contains(entry)
            }
            def addon = new groovy.json.JsonSlurper().parseText(
                    zip.getInputStream(zip.getEntry('bluemap.addon.json')).getText('UTF-8')
            )
            if (addon.id != addon_id
                    || addon.entrypoint != 'io.github.janguenter.bluemap.sophisticated.BlueMapSophisticatedAddon'
                    || addon.dependencies != []
                    || addon['soft-dependencies'] != []) {
                throw new GradleException('BlueMap add-on metadata mismatch')
            }
            def forbidden = entries.findAll {
                it.endsWith('.jar')
                        || it == 'META-INF/neoforge.mods.toml'
                        || it == 'fabric.mod.json'
                        || it.endsWith('.mixins.json')
                        || it.startsWith('de/bluecolored/')
                        || it.startsWith('net/p3pp3rf1y/')
                        || it.startsWith('net/minecraft/')
                        || it.startsWith('net/neoforged/')
                        || it.startsWith(legacyLocalAdapterPackage)
                        || displacedAdapterHelpers.any { helper -> it.startsWith(helper) }
                        || (it.startsWith(sharedAdapterApiPackage)
                            && !sharedAdapterApiClasses.contains(it))
            }
            if (!missing.isEmpty() || !nonUniqueShared.isEmpty()
                    || !foreignClasses.isEmpty() || !forbidden.isEmpty()) {
                throw new GradleException(
                        "Production JAR boundary mismatch: missing=${missing}, "
                                + "nonUniqueShared=${nonUniqueShared}, "
                                + "foreignClasses=${foreignClasses}, forbidden=${forbidden}"
                )
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('verifySourcesJar') {
    dependsOn tasks.named('sourcesJar')
    inputs.file(publishedSourcesJar)

    doLast {
        def zip = new java.util.zip.ZipFile(inputs.files.singleFile)
        try {
            def entries = zip.entries().findAll { !it.directory }.collect { it.name }
            def required = [
                    'io/github/janguenter/bluemap/sophisticated/'
                            + 'BlueMapSophisticatedAddon.java',
                    'bluemap.addon.json',
                    'META-INF/LICENSE-bluemap-sophisticated-addon',
                    'META-INF/bluemap-sophisticated/upstreams.json'
            ]
            required.addAll(sharedAdapterApiSources)
            def missing = required.findAll { !entries.contains(it) }
            def nonUniqueShared = sharedAdapterApiSources.findAll { shared ->
                entries.count { it == shared } != 1
            }
            def foreignJava = entries.findAll { entry ->
                entry.endsWith('.java')
                        && !entry.startsWith(
                            'io/github/janguenter/bluemap/sophisticated/'
                        )
                        && !sharedAdapterApiSources.contains(entry)
            }
            def forbidden = entries.findAll { entry ->
                entry.endsWith('.class')
                        || entry.endsWith('.jar')
                        || entry.startsWith(legacyLocalAdapterPackage)
                        || displacedAdapterHelpers.any { helper ->
                            entry == "${helper}.java"
                        }
                        || (entry.startsWith(sharedAdapterApiPackage)
                            && !sharedAdapterApiSources.contains(entry))
            }
            if (!missing.isEmpty() || !nonUniqueShared.isEmpty()
                    || !foreignJava.isEmpty() || !forbidden.isEmpty()) {
                throw new GradleException(
                        "Sources JAR boundary mismatch: missing=${missing}, "
                                + "nonUniqueShared=${nonUniqueShared}, "
                                + "foreignJava=${foreignJava}, forbidden=${forbidden}"
                )
            }
        } finally {
            zip.close()
        }
    }
}

def verifyAcceptedFile = { File candidate, String sizeProperty, String hashProperty ->
    def expectedSize = providers.gradleProperty(sizeProperty).get().toLong()
    def expectedSha256 = providers.gradleProperty(hashProperty).get()
    def actualSha256 = java.security.MessageDigest.getInstance('SHA-256')
            .digest(candidate.bytes)
            .encodeHex()
            .toString()
    if (expectedSize <= 0 || expectedSha256 == 'PENDING') {
        throw new GradleException(
                "Release identity ${sizeProperty}/${hashProperty} is unsealed"
        )
    }
    if (candidate.length() != expectedSize || actualSha256 != expectedSha256) {
        throw new GradleException(
                "Accepted artifact mismatch for ${candidate}: "
                        + "${candidate.length()} bytes, SHA-256 ${actualSha256}"
        )
    }
}

tasks.register('verifyAcceptedProductionJar') {
    dependsOn tasks.named('jar')
    inputs.file(productionJar)
    doLast {
        verifyAcceptedFile(
                inputs.files.singleFile,
                'accepted_jar_size',
                'accepted_jar_sha256'
        )
    }
}

tasks.register('verifyAcceptedSourcesJar') {
    dependsOn tasks.named('sourcesJar')
    inputs.file(publishedSourcesJar)
    doLast {
        verifyAcceptedFile(
                inputs.files.singleFile,
                'accepted_sources_jar_size',
                'accepted_sources_jar_sha256'
        )
    }
}

tasks.register('verifyPublicationArtifacts') {
    dependsOn tasks.named('generatePomFileForAddonPublication')
    dependsOn tasks.named('generateMetadataFileForAddonPublication')
    doLast {
        verifyAcceptedFile(
                file('build/publications/addon/pom-default.xml'),
                'accepted_pom_size',
                'accepted_pom_sha256'
        )
        verifyAcceptedFile(
                file('build/publications/addon/module.json'),
                'accepted_module_size',
                'accepted_module_sha256'
        )
    }
}

tasks.register('verifyReleaseMetadata') {
    doLast {
        def expectedTag = "v${project.version}"
        def requestedTag = providers.gradleProperty('releaseTag').getOrElse('')
        def release = new groovy.json.JsonSlurper().parse(file('provenance/release.json'))
        if (requestedTag != expectedTag
                || release.status != 'owner-accepted-release-candidate'
                || release.published != false
                || release.version != project.version.toString()
                || release.tag != expectedTag
                || !(release.owner_accepted_staging instanceof Map)
                || release.owner_accepted_staging.visual_acceptance != true
                || !(release.final_release_artifacts instanceof Map)) {
            throw new GradleException('Release provenance is not sealed')
        }
    }
}

tasks.register('verifyReleaseCandidate') {
    dependsOn tasks.named('check')
    dependsOn tasks.named('verifyPinnedArtifacts')
    dependsOn tasks.named('verifyAcceptedProductionJar')
    dependsOn tasks.named('verifyAcceptedSourcesJar')
    dependsOn tasks.named('verifyPublicationArtifacts')
    dependsOn tasks.named('verifyReleaseMetadata')
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyProductionJar')
    dependsOn tasks.named('verifySourcesJar')
}

tasks.register('verifyPinnedArtifacts', Exec) {
    def coreJar = providers.gradleProperty('sophisticatedCoreJar')
    def storageJar = providers.gradleProperty('sophisticatedStorageJar')
    def backpacksJar = providers.gradleProperty('sophisticatedBackpacksJar')
    doFirst {
        if (!coreJar.isPresent() || !storageJar.isPresent() || !backpacksJar.isPresent()) {
            throw new GradleException(
                    'Set -PsophisticatedCoreJar, -PsophisticatedStorageJar, '
                            + 'and -PsophisticatedBackpacksJar to the exact ATM 1.2.0 artifacts.'
            )
        }
    }
    commandLine 'python3', 'tools/verify_pinned_artifacts.py',
            '--core', coreJar.getOrElse('missing'),
            '--storage', storageJar.getOrElse('missing'),
            '--backpacks', backpacksJar.getOrElse('missing')
}

publishing {
    publications {
        addon(MavenPublication) {
            from components.java
            artifactId = artifact_id
            pom {
                name = addon_name
                description = 'Exact-profile BlueMap rendering for Sophisticated Storage and Backpacks.'
                url = 'https://github.com/jan-guenter/bluemap-sophisticated-addon'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://spdx.org/licenses/MIT.html'
                        distribution = 'repo'
                    }
                }
                scm {
                    url = 'https://github.com/jan-guenter/bluemap-sophisticated-addon'
                    connection = 'scm:git:https://github.com/jan-guenter/bluemap-sophisticated-addon.git'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/jan-guenter/bluemap-sophisticated-addon')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
